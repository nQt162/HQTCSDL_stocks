name: merge_daily_csv_and_run_pipeline

on:
  workflow_run:
    workflows: ["cao_dl"]
    types: [completed]
  workflow_dispatch:
    inputs:
      note:
        description: "Ghi chu khi chay thu cong, co the bo trong."
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: merge-daily-csv-and-run-pipeline
  cancel-in-progress: false

jobs:
  merge-and-run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Notify workflow started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifications/telegram_alert.py --workflow merge_daily_csv_and_run_pipeline --phase start

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r requirement.txt
          fi

      - name: Run full stock pipeline
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT || '8443' }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE || 'stock' }}
          CLICKHOUSE_SECURE: ${{ secrets.CLICKHOUSE_SECURE || 'true' }}
        run: python main.py

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-data-and-model-outputs
          path: |
            data/dirty/Data_500_stocks_dirty.csv
            data/clean/*.csv
            data/clean_log/*
            data/khaosatdata/*
            data/pipeline_run_summary.json
            models/model4/models/*.pkl
            models/model5/models/*.pkl
            models/model4/output/**
            models/model5/output_model5/**
          if-no-files-found: warn
          retention-days: 30

      - name: Commit merged data and pipeline outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # CHI THÊM file tom tat nhe de bao ve git
          if [ -f "data/pipeline_run_summary.json" ]; then
            git add "data/pipeline_run_summary.json"
          fi
          if git diff --cached --quiet; then
            echo "No summary changes to commit"
          else
            git commit -m "Update daily pipeline execution summary [skip ci]"
            git push
          fi

      - name: Notify workflow finished
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifications/telegram_alert.py --workflow merge_daily_csv_and_run_pipeline --phase end --status "${{ job.status }}"
