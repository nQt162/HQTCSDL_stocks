name: cao_dl

on:
  schedule:
    # Chạy mỗi ngày lúc 15:00 giờ Việt Nam.
    # GitHub Actions dùng UTC, Việt Nam UTC+7 nên 15:00 VN = 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Ngay can cao, dinh dang YYYY-MM-DD. Bo trong thi lay ngay hom qua theo gio VN."
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Sửa cảnh báo Node.js sắp bị khai tử của GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Notify workflow started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifications/telegram_alert.py --workflow cao_dl --phase start

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r requirement.txt
          fi

      - name: Crawl daily stock CSV
        run: python main_cao_dl.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-csv-files
          path: data/dirty/stock_*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit CSV outputs to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Thêm tham số -f để ép buộc Git nhận file .csv bất kể cấu hình .gitignore
          if compgen -G "data/dirty/stock_*.csv" > /dev/null; then
            git add -f data/dirty/stock_*.csv
          else
            echo "No stock CSV files to commit"
          fi
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add stock CSV output"
            git push
          fi

      - name: Notify workflow finished
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifications/telegram_alert.py --workflow cao_dl --phase end --status "${{ job.status }}"
